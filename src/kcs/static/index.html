<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kcs</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div class="logo"><span>kcs</span></div>
  <div class="actions"><button onclick="showCreate()">+ New Container</button> <button onclick="manualRefresh()" class="refresh-btn" id="refresh-btn" title="Refresh">&#x21bb;</button></div>
  <div id="topo" class="topo"></div>
  <div class="hint">click a card to inspect  ·  esc to close</div>
</div>

<div class="panel" id="p">
  <button class="close" onclick="closePanel()">&times;</button>
  <div class="body" id="pb"></div>
</div>

<div class="login-overlay" id="login-overlay" style="display:none">
  <div class="login-card">
    <h2>kcs</h2>
    <p>Enter API key to continue</p>
    <input id="login-input" type="password" placeholder="API key" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn primary" onclick="doLogin()">Unlock</button>
    <div class="login-err" id="login-err">Invalid key — try again</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
